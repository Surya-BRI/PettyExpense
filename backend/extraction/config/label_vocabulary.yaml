# Generic, language-level synonyms for universal receipt/invoice concepts.
#
# Rules for editing this file:
#   - OK to add: a word or phrase that names a concept in ANY natural language
#     (e.g. a new language's word for "total"). This is linguistic vocabulary,
#     not vendor/layout knowledge, and is additive by design.
#   - NOT OK to add: a brand name, company name, store type, or any string
#     specific to one vendor's receipt layout. That belongs in reference data
#     (known_vendors / categories), never here.
