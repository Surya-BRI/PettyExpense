  - total
  - grand total
  - amount due
  - bill amount
  - net amount
  - paid amount
  - amount incl vat
  - amount (incl. vat)
  - total incl
  - total incl vat
  - الإجمالي
  - المجموع
  - المجموع فقط
  - الاجمالى
  - اجمالي المبلغ
  - المبلغ الإجمالي
  - الاجمالي
  - الإجمالي شامل القيمة المضافة
