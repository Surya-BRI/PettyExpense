document_type_header:
  # A universal "what kind of document is this" label almost every receipt
  # prints near the top — recognized only so it doesn't get mistaken for the
  # vendor name; never mapped to any extracted field itself.
  - tax invoice
  - cash invoice
  - sales receipt
  - cash receipt
  - customer receipt
  - customer invoice
  - invoice
  - receipt
  - فاتورة ضريبية
  - فاتورة راكب
  - فاتورة
  - إيصال
generic_business_entity_word:
  # A bare legal-entity-type word ("Company", "شركة") is not a vendor name by
  # itself — it's recognized only so a vendor candidate that is JUST this
  # word (nothing else) gets excluded, the same way a document-type header
  # is excluded from the vendor field above. A real name that merely
  # CONTAINS one of these words (e.g. "Qamar Alhuda General Trading L.L.C")
  # is unaffected — exclusion only fires when the match covers most of the
  # line, per _vendor_candidates' existing coverage-ratio check.
  - company
  - corporation
  - establishment
  - شركة
  - مؤسسة
  - المحدودة
item_table_header:
  - qty
  - quantity
  - description
  - line item
  - unit price
  - الكمية
  - الوصف
from_location:
  # Recognized only so a "from <place>" line isn't mistaken for a vendor name
  # or a money value — never mapped to an extracted field itself, the same
  # way document_type_header is recognized-but-unmapped above. English "from"/
  # "to" are deliberately excluded here: as bare 2-4 letter substrings they
  # collide too easily with unrelated words (e.g. "to" inside "Total"), unlike
  # the longer Arabic terms which are safe under the same substring matching.
  - من
to_location:
  - إلى
notes:
  - ملاحظات
